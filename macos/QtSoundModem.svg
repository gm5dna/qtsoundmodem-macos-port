<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- Apple-style rounded square, single flat colour -->
  <rect x="0" y="0" width="1024" height="1024" rx="225" ry="225" fill="#0f2942"/>

  <!-- Single bold AFSK packet-burst waveform: low frequency → high frequency.
       One element, thick stroke, posterized graphic feel. -->
  <g transform="translate(0, 512)" stroke="#5eead4" stroke-width="48"
     fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- 3 low-freq cycles -->
    <path d="M 128 0 Q 192 -180 256 0 T 384 0 T 512 0"/>
    <!-- 6 high-freq cycles -->
    <path d="M 512 0 Q 544 -160 576 0 T 640 0 T 704 0 T 768 0 T 832 0 T 896 0"/>
  </g>
</svg>
